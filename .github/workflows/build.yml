name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Project banao
        run: |
          mkdir -p /tmp/keep
          cp main.dart /tmp/keep/main.dart
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create --project-name clip_cutter --org com.clipcutter --platforms android .
          cp /tmp/keep/main.dart lib/main.dart
          cp /tmp/keep/pubspec.yaml pubspec.yaml

      - name: Android settings (minSdk + permissions)
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle || true
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/><application#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ClipCutter-APK
          path: build/app/outputs/flutter-apk/app-release.apk
